# On every push to main (or by hand from the Actions tab), after the tests and type check pass:
# - the public, browser-only edition goes to GitHub Pages
#   (one-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions")
# - the private family edition (shared data, Phase F) goes to Cloudflare Pages, https://ourfamilytree.pages.dev
#   (one-time setup: repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; skipped until they exist)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an older one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build
        run: npm run build
        env:
          # Pages serves the site at https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  family:
    needs: build
    runs-on: ubuntu-latest
    # One family deploy at a time, never cancelled half way (it may be changing the database).
    concurrency:
      group: family
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare is set up
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Family edition not deployed: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."; fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - if: steps.ready.outputs.ok == 'true'
        name: Build the family edition
        run: npm run build:family
      - if: steps.ready.outputs.ok == 'true'
        name: Apply database changes
        run: npx wrangler d1 migrations apply family-tree --remote
      - if: steps.ready.outputs.ok == 'true'
        name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy --branch main
